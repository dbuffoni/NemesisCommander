[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/dbuffoni/SuperCommander"
# License intentionally not declared yet: see docs/OPEN_QUESTIONS.md.

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

# Shared dependency versions. Crates opt in with `name.workspace = true`
# so that the whole workspace always agrees on a single version.
[workspace.dependencies]
# internal crates
sc-vfs = { path = "crates/sc-vfs" }
sc-hash = { path = "crates/sc-hash" }
sc-providers = { path = "crates/sc-providers" }
sc-ops = { path = "crates/sc-ops" }

# async & utilities
async-trait = "0.1.92"
bitflags = { version = "2.13.2", features = ["serde"] }
bytes = "1.12.1"
futures = "0.3.34"
futures-core = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio-util = "0.7.20"
regex = "1.13.1"
globset = "0.4.21"
tokio = { version = "1.54.1", features = ["io-util", "rt", "macros"] }

# hashing
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
sha2 = "0.11.1"
hex = "0.4.3"

# file system helpers
filetime = "0.2.29"
trash = "5.3.0"
reflink-copy = "0.1.33"

# dev
proptest = "1.11.0"
tempfile = "3"
