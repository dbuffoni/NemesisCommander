[workspace]
resolver = "3"
members = ["crates/*", "gui"]
# The desktop interface needs Qt, so plain `cargo build` and `cargo test`
# leave it out; build it with `-p nmc-gui`.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/dbuffoni/NemesisCommander"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dependencies are optimized (hashing and compression are slow otherwise)
# and carry no debug info, which keeps the build folder small.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Shared dependency versions. Crates opt in with `name.workspace = true`
# so that the whole workspace always agrees on a single version.
[workspace.dependencies]
# internal crates
nmc-vfs = { path = "crates/nmc-vfs" }
nmc-hash = { path = "crates/nmc-hash" }
nmc-providers = { path = "crates/nmc-providers", default-features = false }
nmc-ops = { path = "crates/nmc-ops" }
nmc-transfer = { path = "crates/nmc-transfer" }
nmc-index = { path = "crates/nmc-index" }
nmc-archive = { path = "crates/nmc-archive" }
nmc-config = { path = "crates/nmc-config" }
nmc-panel = { path = "crates/nmc-panel" }
nmc-app = { path = "crates/nmc-app", default-features = false }
nmc-frontend = { path = "crates/nmc-frontend" }
nmc-tui = { path = "crates/nmc-tui" }
nmc-proto = { path = "crates/nmc-proto" }
nmc-agent = { path = "crates/nmc-agent" }
nmc-ssh = { path = "crates/nmc-ssh" }
nmc-sftp = { path = "crates/nmc-sftp" }
nmc-webdav = { path = "crates/nmc-webdav" }
nmc-s3 = { path = "crates/nmc-s3" }
nmc-smb = { path = "crates/nmc-smb" }
nmc-tls = { path = "crates/nmc-tls" }
nmc-script = { path = "crates/nmc-script", default-features = false }
nmc-preview = { path = "crates/nmc-preview" }

# async & utilities
async-trait = "0.1.92"
bitflags = { version = "2.13.2", features = ["serde"] }
bytes = "1.12.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio-util = "0.7.20"
regex = "1.13.1"
similar = "2.7.0"
serde_json = "1.0.154"
toml = "1.2.1"
directories = "6.0.0"
jiff = "0.2.45"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
globset = "0.4.21"
memchr = "2"
tokio = { version = "1.54.1", features = ["io-util", "rt", "macros"] }

# hashing
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
sha2 = "0.11.1"
hex = "0.4.3"

# archives and compression
zip = { version = "9.6.0", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma", "xz", "time", "aes-crypto"] }
tar = "0.4.46"
flate2 = "1.1.11"
liblzma = { version = "0.4.9", features = ["static"] }
bzip2 = "0.6.1"
zstd = "0.14.4"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["compress", "util", "aes256"] }
unrar = "0.5.8"

# images (viewer)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }

# file system helpers
filetime = "0.2.29"
trash = "5.3.0"
reflink-copy = "0.1.33"

# dev
proptest = "1.11.0"
tempfile = "3"
