// The protocol spoken between a SuperCommander controller (GUI, TUI, CLI)
// and an `sc agent` running on a remote Linux machine.
//
// One HTTP/2 connection carries every call as its own stream, so a large
// transfer never blocks browsing. Paths are absolute POSIX paths on the
// agent's machine. Errors are gRPC status codes (NOT_FOUND, ALREADY_EXISTS,
// PERMISSION_DENIED, UNIMPLEMENTED, FAILED_PRECONDITION, ...) with a
// readable message; `sc-proto` maps them to `VfsError` and back.
//
// Compatibility: fields are only ever added. A controller calls Hello first
// and must refuse an agent whose `protocol` major version differs.

syntax = "proto3";

package sc.agent.v1;

service Agent {
  // Handshake: versions, capabilities and the limits the agent enforces.
  rpc Hello(HelloRequest) returns (HelloReply);

  rpc Stat(PathRequest) returns (Entry);
  // Directory contents in pages, so the first rows arrive at once.
  rpc List(PathRequest) returns (stream EntryPage);
  rpc Read(ReadRequest) returns (stream Chunk);
  // The first message carries the header, the following ones the data.
  rpc Write(stream WriteRequest) returns (WriteReply);

  rpc CreateDir(PathRequest) returns (Empty);
  rpc RemoveFile(PathRequest) returns (Empty);
  rpc RemoveDir(PathRequest) returns (Empty);
  rpc Rename(TwoPaths) returns (Empty);
  rpc CopyWithin(TwoPaths) returns (Empty);
  rpc SetAttributes(SetAttributesRequest) returns (Empty);
  rpc Checksum(ChecksumRequest) returns (ChecksumReply);
  rpc CreateSymlink(SymlinkRequest) returns (Empty);
}

message Empty {}

message HelloRequest {
  // Protocol version of the controller, e.g. "1.0".
  string protocol = 1;
  // The controller's program version, for logs.
  string client_version = 2;
}

message HelloReply {
  string protocol = 1;
  // The agent's program version (the controller re-installs on mismatch).
  string agent_version = 2;
  // Folders the agent serves; empty means the whole file system.
  repeated string roots = 3;
  bool read_only = 4;
  // Hash algorithms Checksum accepts ("blake3", "xxh3", "sha256").
  repeated string hash_algorithms = 5;
}

message PathRequest {
  string path = 1;
}

message TwoPaths {
  string from = 1;
  string to = 2;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIRECTORY = 2;
  ENTRY_KIND_SYMLINK = 3;
  ENTRY_KIND_OTHER = 4;
}

message Entry {
  string name = 1;
  EntryKind kind = 2;
  uint64 size = 3;
  // Modification time in nanoseconds since the Unix epoch.
  optional int64 modified_ns = 4;
  optional uint32 permissions = 5;
  optional uint32 uid = 6;
  optional uint32 gid = 7;
  optional string symlink_target = 8;
  bool link_is_dir = 9;
}

message EntryPage {
  repeated Entry entries = 1;
}

message ReadRequest {
  string path = 1;
  uint64 offset = 2;
}

message Chunk {
  bytes data = 1;
}

enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  // Fail if the file exists.
  WRITE_MODE_CREATE_NEW = 1;
  WRITE_MODE_TRUNCATE = 2;
  // Keep the first `offset` bytes and append after them.
  WRITE_MODE_RESUME = 3;
}

message WriteHeader {
  string path = 1;
  WriteMode mode = 2;
  uint64 offset = 3;
  optional uint64 size_hint = 4;
}

message WriteRequest {
  oneof part {
    WriteHeader header = 1;
    bytes data = 2;
  }
}

message WriteReply {
  uint64 bytes_written = 1;
}

message SetAttributesRequest {
  string path = 1;
  optional uint32 permissions = 2;
  optional int64 modified_ns = 3;
}

message ChecksumRequest {
  string path = 1;
  string algorithm = 2;
}

message ChecksumReply {
  string hex = 1;
}

message SymlinkRequest {
  string path = 1;
  string target = 2;
}
