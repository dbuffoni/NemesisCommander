[package]
name = "nmc-smb"
description = "SMB 2/3 provider for NemesisCommander (smb://), for Windows shares, Samba and NAS devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
nmc-vfs.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
# Pure Rust SMB 2/3 client: no libsmbclient, builds for every target.
smb2 = "0.43.0"
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
nmc-ops.workspace = true
nmc-providers.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
