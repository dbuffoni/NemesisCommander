[package]
name = "sc-cli"
description = "The `sc` binary: SuperCommander's command line, terminal UI and remote agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
default-run = "sc"

[[bin]]
name = "sc"
path = "src/main.rs"

[dependencies]
sc-vfs.workspace = true
sc-hash.workspace = true
sc-ops.workspace = true
sc-transfer.workspace = true
sc-index.workspace = true
sc-archive.workspace = true
sc-config.workspace = true
sc-panel.workspace = true
sc-app = { workspace = true, default-features = false }
sc-tui = { workspace = true, optional = true }
sc-agent.workspace = true
sc-tls.workspace = true
sc-script = { workspace = true, optional = true, features = ["engine"] }
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tempfile = { workspace = true, optional = true }
# `sc ai`: the same HTTP client and TLS as WebDAV and S3 (already in `sc`).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"], optional = true }
rustls = { version = "0.23.4", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[features]
default = ["desktop", "remote", "tui", "scripting", "ai"]
# Desktop build: recycle bin support.
desktop = ["sc-app/desktop"]
# SFTP, WebDAV, S3 and SMB locations. Agent-only server builds leave
# them out (agent:// and scs:// stay).
remote = ["sc-app/remote"]
# The terminal UI started by `sc` without a command. Agent-only server
# builds leave it out.
tui = ["dep:sc-tui"]
# `sc run`: TypeScript scripts on V8 (adds 30-40 MB). Agent-only server
# builds leave it out.
scripting = ["dep:sc-script", "dep:tempfile", "sc-tui?/scripting"]
# `sc ai`: scripts written by Claude with the user's API key, tested with
# `sc test`. Agent-only server builds leave it out.
ai = ["scripting", "dep:reqwest", "dep:rustls"]
rar = ["sc-app/rar"]

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
