[package]
name = "sc-cli"
description = "The `sc` binary: SuperCommander's command line, terminal UI and remote agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
default-run = "sc"

[[bin]]
name = "sc"
path = "src/main.rs"

[dependencies]
sc-vfs.workspace = true
sc-hash.workspace = true
sc-ops.workspace = true
sc-transfer.workspace = true
sc-index.workspace = true
sc-archive.workspace = true
sc-config.workspace = true
sc-panel.workspace = true
sc-app = { workspace = true, default-features = false }
sc-tui = { workspace = true, optional = true }
sc-agent.workspace = true
sc-tls.workspace = true
sc-script = { workspace = true, optional = true }
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true

[features]
default = ["desktop", "remote", "tui", "scripting"]
# Desktop build: recycle bin support.
desktop = ["sc-app/desktop"]
# SFTP, WebDAV, S3 and SMB locations. Agent-only server builds leave
# them out (agent:// and scs:// stay).
remote = ["sc-app/remote"]
# The terminal UI started by `sc` without a command. Agent-only server
# builds leave it out.
tui = ["dep:sc-tui"]
# `sc run`: TypeScript scripts on V8 (adds 30-40 MB). Agent-only server
# builds leave it out.
scripting = ["dep:sc-script", "sc-tui?/scripting"]
rar = ["sc-app/rar"]

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
