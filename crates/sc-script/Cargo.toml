[package]
name = "sc-script"
description = "SuperCommander's TypeScript scripting: V8 through deno_core, the `sc` API over the copy engine and providers, and per-script permissions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

# V8 adds 30-40 MB to the program: `sc` includes this crate only with its
# `scripting` feature, which server (agent) builds leave out.

[dependencies]
sc-vfs.workspace = true
sc-ops.workspace = true
deno_core = { version = "0.413.0", optional = true }
deno_error = { version = "0.7.1", optional = true }
deno_ast = { version = "0.53.3", features = ["transpiling"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time", "net"] }

[features]
default = ["engine"]
# V8 and the `sc` API: running scripts. Without it, only plugin manifests,
# grants and permissions (sc-gui runs scripts through the `sc` program).
engine = ["dep:deno_core", "dep:deno_error", "dep:deno_ast"]

[dev-dependencies]
sc-providers.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
