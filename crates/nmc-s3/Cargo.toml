[package]
name = "nmc-s3"
description = "S3 provider for NemesisCommander (s3://), for AWS and S3-compatible servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
nmc-vfs.workspace = true
async-trait.workspace = true
bytes.workspace = true
directories.workspace = true
futures.workspace = true
hex.workspace = true
hmac = "0.13.0"
httpdate = "1.0.3"
jiff.workspace = true
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23.4", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
nmc-ops.workspace = true
nmc-providers.workspace = true
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1"] }
s3s = "0.17.0"
s3s-fs = "0.17.0"
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
