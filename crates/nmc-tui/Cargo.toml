[package]
name = "nmc-tui"
description = "NemesisCommander's terminal user interface: two panels, keyboard driven, F1 for the main shortcuts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nmc-frontend.workspace = true
nmc-preview.workspace = true
nmc-vfs.workspace = true
nmc-s3.workspace = true
nmc-config.workspace = true
nmc-panel.workspace = true
nmc-transfer.workspace = true
nmc-app.workspace = true
futures.workspace = true
image.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[features]
# Plugin commands and scripts (Alt+X), see nmc-frontend.
scripting = ["nmc-frontend/script-engine"]

[dev-dependencies]
async-trait.workspace = true
nmc-agent.workspace = true
nmc-proto.workspace = true
serde_json.workspace = true
nmc-ops.workspace = true
image.workspace = true
tempfile.workspace = true
nmc-providers.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
