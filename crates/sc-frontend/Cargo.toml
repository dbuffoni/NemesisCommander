[package]
name = "sc-frontend"
description = "The interactive application model shared by SuperCommander's terminal and desktop interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
sc-vfs.workspace = true
sc-hash.workspace = true
sc-ops.workspace = true
sc-transfer.workspace = true
sc-index.workspace = true
sc-archive.workspace = true
sc-config.workspace = true
sc-panel.workspace = true
sc-app.workspace = true
sc-ssh.workspace = true
sc-preview.workspace = true
async-trait.workspace = true
similar.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
directories.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util.workspace = true
sc-script = { workspace = true, optional = true }

[features]
# Plugin commands and scripts from the panels (Alt+X). On its own, scripts
# run in the `sc` program next to this one (so V8 is not linked twice);
# with `script-engine` they run in this process, on V8.
scripting = ["dep:sc-script"]
script-engine = ["scripting", "sc-script/engine"]

[dev-dependencies]
tempfile.workspace = true
sc-providers.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
