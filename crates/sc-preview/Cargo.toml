[package]
name = "sc-preview"
description = "SuperCommander's native file previews: Markdown, PDF, Office documents and spreadsheets, 3D models and pictures, as text or pixels any interface can show."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
zip.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
quick-xml = "0.42.0"
calamine = "0.38.0"
hayro = "0.9.0"
stl_io = "0.11.0"
tobj = { version = "4.0.5", default-features = false }
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils"] }

[dev-dependencies]
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
