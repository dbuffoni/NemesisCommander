[package]
name = "sc-agent"
description = "SuperCommander's remote agent: the `sc agent --stdio` server and the agent:// provider that starts it over SSH."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sc-vfs.workspace = true
sc-hash.workspace = true
sc-providers.workspace = true
sc-proto.workspace = true
sc-ssh.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
tonic = "0.14.9"
tokio = { workspace = true, features = ["io-std", "io-util", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
tempfile.workspace = true
sc-ops.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
