[package]
name = "sc-agent"
description = "SuperCommander's remote agent: `sc agent --stdio` over SSH, `sc serve` over mutual TLS, their agent:// and scs:// providers, and server-to-server copies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
sc-vfs.workspace = true
sc-hash.workspace = true
sc-providers.workspace = true
sc-proto.workspace = true
sc-ssh.workspace = true
sc-ops.workspace = true
sc-tls.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde_json.workspace = true
tonic = "0.14.9"
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
tempfile.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
