[package]
name = "sc-webdav"
description = "WebDAV provider for SuperCommander (dav:// and davs://)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
sc-vfs.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
httpdate = "1.0.3"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
# rustls with the `ring` crypto provider: pure Rust plus a little C and
# assembly that cross-compiles everywhere (no cmake, no OpenSSL).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23.4", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
sc-ops.workspace = true
sc-providers.workspace = true
dav-server = "0.12.0"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
