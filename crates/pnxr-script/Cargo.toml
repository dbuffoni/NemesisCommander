[package]
name = "pnxr-script"
description = "Pairnox's TypeScript scripting: V8 through deno_core, the `pnxr` API over the copy engine and providers, and per-script permissions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

# V8 adds about 60 MB to a program: only `pnxr` turns on `engine` (with its
# `scripting` feature, which agent builds leave out); the window runs
# scripts through `pnxr` (ADR 0020).

[dependencies]
pnxr-vfs.workspace = true
pnxr-ops.workspace = true
deno_core = { version = "0.413.0", optional = true }
deno_error = { version = "0.7.1", optional = true }
deno_ast = { version = "0.53.3", features = ["transpiling"], optional = true }
image = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time", "net", "process"] }

[features]
default = ["engine"]
# V8 and the `pnxr` API: running scripts. Without it, only plugin manifests,
# grants and permissions (pnxr-gui runs scripts through the `pnxr` program).
engine = ["dep:deno_core", "dep:deno_error", "dep:deno_ast", "dep:image"]

[dev-dependencies]
pnxr-providers.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
