[package]
name = "nmc-vfs"
description = "Virtual file system abstractions for NemesisCommander: URIs, entries, capabilities and the Provider trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
bitflags.workspace = true
bytes.workspace = true
directories.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
# The Credential Manager (credential API only).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
