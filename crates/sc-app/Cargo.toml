[package]
name = "sc-app"
description = "Wires SuperCommander together: settings, providers and the transfer manager, for every front end."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
sc-vfs.workspace = true
sc-providers.workspace = true
sc-archive.workspace = true
sc-config.workspace = true
sc-ops.workspace = true
sc-transfer.workspace = true
sc-agent.workspace = true
sc-ssh.workspace = true
sc-sftp = { workspace = true, optional = true }
sc-webdav = { workspace = true, optional = true }
sc-s3 = { workspace = true, optional = true }
sc-smb = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util"] }

[features]
default = ["desktop", "remote"]
# Everything a desktop build wants (recycle bin, ...). Server builds of
# `sc` disable it.
desktop = ["sc-providers/trash"]
# SFTP, WebDAV, S3 and SMB. Agent-only server builds leave them out: the
# agent serves its own disk, and agent:// / scs:// stay in every build.
remote = ["dep:sc-sftp", "dep:sc-webdav", "dep:sc-s3", "dep:sc-smb"]
rar = ["sc-archive/rar"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
