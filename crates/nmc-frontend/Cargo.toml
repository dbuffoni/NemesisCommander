[package]
name = "nmc-frontend"
description = "The interactive application model shared by NemesisCommander's terminal and desktop interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
nmc-vfs.workspace = true
nmc-hash.workspace = true
nmc-ops.workspace = true
nmc-transfer.workspace = true
nmc-index.workspace = true
nmc-archive.workspace = true
nmc-config.workspace = true
nmc-panel.workspace = true
nmc-app.workspace = true
nmc-ssh.workspace = true
nmc-preview.workspace = true
async-trait.workspace = true
similar.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
directories.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util.workspace = true
nmc-script = { workspace = true, optional = true }

[features]
# Plugin commands and scripts from the panels (Alt+X). On its own, scripts
# run in the `nmc` program next to this one (so V8 is not linked twice);
# with `script-engine` they run in this process, on V8.
scripting = ["dep:nmc-script"]
script-engine = ["scripting", "nmc-script/engine"]

[dev-dependencies]
tempfile.workspace = true
nmc-providers.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
