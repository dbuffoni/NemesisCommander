[package]
name = "nmc-providers"
description = "Concrete NemesisCommander VFS providers: local disk and in-memory (more behind features)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nmc-vfs.workspace = true
nmc-hash.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
filetime.workspace = true
reflink-copy.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "rt"] }
trash = { workspace = true, optional = true }

# Extended attributes (macOS quarantine and tags, Linux user.*).
[target.'cfg(unix)'.dependencies]
xattr = "1.3"

# Windows file attributes: the one call std lacks (hidden, system).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
default = ["trash"]
# Moving files to the desktop recycle bin. Off for server builds.
trash = ["dep:trash"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true

[lints]
workspace = true
