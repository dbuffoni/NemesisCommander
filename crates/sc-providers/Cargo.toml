[package]
name = "sc-providers"
description = "Concrete SuperCommander VFS providers: local disk and in-memory (more behind features)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
sc-vfs.workspace = true
sc-hash.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
filetime.workspace = true
reflink-copy.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "rt"] }
trash = { workspace = true, optional = true }

[features]
default = ["trash"]
# Moving files to the desktop recycle bin. Off for server builds.
trash = ["dep:trash"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true

[lints]
workspace = true
