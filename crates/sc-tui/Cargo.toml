[package]
name = "sc-tui"
description = "SuperCommander's terminal user interface: two panels, keyboard driven, F1 for the main shortcuts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
sc-frontend.workspace = true
sc-vfs.workspace = true
sc-config.workspace = true
sc-panel.workspace = true
sc-transfer.workspace = true
sc-app.workspace = true
futures.workspace = true
image.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[features]
# Plugin commands and scripts (Alt+X), see sc-frontend.
scripting = ["sc-frontend/scripting"]

[dev-dependencies]
sc-ops.workspace = true
image.workspace = true
tempfile.workspace = true
sc-providers.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
