# Two tiers in one workflow.
#
# Simple tier: every push to main and every pull request (fast, Linux only).
# Full tier: every night at 01:00 Rome time, on request (Run workflow), and on
# pull requests labelled `full-ci`. It adds macOS and Windows and the heavy
# checks against real servers; new heavy checks are new jobs with
# `needs: plan` and `if: needs.plan.outputs.full == 'true'`.
# See docs/ci.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # 01:00 in Rome is 23:00 UTC in summer time and 00:00 UTC in winter
    # time, and cron has no time zones: both run, and the `plan` job lets
    # only the one that falls on 01:00 in Rome go on.
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      # Whether anything runs at all (false for the scheduled run that is not
      # at 01:00 in Rome) and whether the full tier runs.
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          run=true
          full=false
          if [ "$EVENT" = schedule ]; then
            # GitHub may start a scheduled run a few minutes late: only the
            # hour counts.
            [ "$(TZ=Europe/Rome date +%H)" = 01 ] && full=true || run=false
          elif [ "$EVENT" = workflow_dispatch ]; then
            full=true
          elif echo "$LABELS" | grep -q '"full-ci"'; then
            full=true
          fi
          os='["ubuntu-24.04"]'
          [ "$full" = true ] && os='["ubuntu-24.04","macos-latest","windows-latest"]'
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "run=$run full=$full os=$os" >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: plan
    if: needs.plan.outputs.run == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    name: Format and lint
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain version comes from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # rust-cache can restore v8's build output without the prebuilt
      # library its build script downloaded; make the script run again.
      - name: Let v8 fetch its library
        shell: bash
        run: rm -rf target/*/build/v8-* target/*/.fingerprint/v8-* target/*/deps/libv8-* target/*/deps/v8-*
      - run: cargo fmt --all --check
      # Every dependency has a licence we may ship, and its notice is known.
      - run: python3 scripts/third_party.py --check
      - name: No trace of the old name
        run: |
          if git grep -nIiE 'nemesis|\bnmc\b|nmc[-_]|NMC_' -- . ':!docs/adr' ':!CHANGELOG.md' ':!README.md' ':!.github/workflows/ci.yml'; then
            echo "The old name NemesisCommander / nmc is still used (see above)"; exit 1
          fi
      # The desktop interface needs Qt: it is checked in the `gui` job.
      - run: cargo clippy --workspace --exclude pnxr-gui --all-targets

  test:
    name: Test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.run == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux always; macOS and Windows in the full tier.
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    env:
      # The servers installed below must be there: a missing one fails the
      # test instead of skipping it.
      PNXR_REQUIRE_SERVERS: ${{ startsWith(matrix.os, 'ubuntu') && 'sftp,smb,ssh' || '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # rust-cache can restore v8's build output without the prebuilt
      # library its build script downloaded; make the script run again.
      - name: Let v8 fetch its library
        shell: bash
        run: rm -rf target/*/build/v8-* target/*/.fingerprint/v8-* target/*/deps/libv8-* target/*/deps/v8-*
      # OpenSSH's sftp-server and Samba, for the SFTP and SMB provider tests,
      # and a private sshd for the `pnxr serve install` test.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-sftp-server openssh-server samba
          sudo scripts/smb-test-server.sh /var/tmp/pnxr-smb >> "$GITHUB_ENV"
          sudo mkdir -p /run/sshd
          scripts/ssh-test-server.sh /var/tmp/pnxr-ssh >> "$GITHUB_ENV"
      # A throwaway keychain, so the Keychain tests do not need the login one.
      - if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci "$RUNNER_TEMP/pnxr.keychain"
          security set-keychain-settings "$RUNNER_TEMP/pnxr.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/pnxr.keychain"
          security default-keychain -s "$RUNNER_TEMP/pnxr.keychain"
      - run: cargo test --workspace --exclude pnxr-gui
      # RAR is read with the bundled libarchive (feature `rar`, on in releases).
      - run: cargo test -p pnxr-archive --features rar
      # No unRAR code in the release (ADR 0050).
      - name: No unrar crate
        shell: bash
        run: "! cargo tree -i unrar 2>/dev/null"

  gui:
    name: Desktop interface (Qt 6)
    needs: plan
    if: needs.plan.outputs.run == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: gui
      # rust-cache can restore v8's build output without the prebuilt
      # library its build script downloaded; make the script run again.
      - name: Let v8 fetch its library
        shell: bash
        run: rm -rf target/*/build/v8-* target/*/.fingerprint/v8-* target/*/deps/libv8-* target/*/deps/v8-*
      # lld: cxx-qt picks a linker that handles Qt's object files; without
      # it, it picks gold, which drops cxx-qt's initializers.
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtqml-models
      - run: cargo clippy -p pnxr-gui --all-targets
      # The window runs plugins through the `pnxr` program next to it: build
      # it first, on its own so the window does not link the script engine
      # (ADR 0020).
      - run: cargo build -p pnxr-cli
      # The window tests use Qt's offscreen platform: no display needed.
      - run: cargo test -p pnxr-gui

  gui-other:
    name: Desktop interface (${{ matrix.os }})
    # Slow: the full tier only.
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: gui
      # rust-cache can restore v8's build output without the prebuilt
      # library its build script downloaded; make the script run again.
      - name: Let v8 fetch its library
        shell: bash
        run: rm -rf target/*/build/v8-* target/*/.fingerprint/v8-* target/*/deps/libv8-* target/*/deps/v8-*
      # Qt's official build, as the installers will use; it puts qmake and
      # Qt's libraries on PATH.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          cache: true
      # Qt's qyieldcpu.h calls the ARM intrinsic __yield without including
      # its header, which the current Xcode's clang rejects.
      - if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-include arm_acle.h" >> "$GITHUB_ENV"
      # The window runs plugins through the `pnxr` program next to it.
      - run: cargo build -p pnxr-cli
      - run: cargo test -p pnxr-gui
        env:
          QT_QPA_PLATFORM: offscreen

  # Installers for Windows and macOS (unsigned here), installed into a
  # temporary folder and started: the full tier only.
  installers:
    name: Installers
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/installers.yml

  # ---- The full tier: heavy checks against real servers ----------------------
  # Everything below runs only when `plan` says `full` (nightly, Run workflow,
  # or a pull request labelled `full-ci`). A missing server fails the test
  # (PNXR_REQUIRE_SERVERS) instead of skipping it.

  s3-webdav-faults:
    name: S3 (MinIO), WebDAV (Apache), network faults
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    env:
      PNXR_REQUIRE_SERVERS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: heavy
      - name: Start MinIO, Apache mod_dav and toxiproxy
        run: scripts/heavy/up.sh >> "$GITHUB_ENV"
      - name: S3 against MinIO
        run: cargo test -p pnxr-s3 --test real_server
      - name: WebDAV against Apache mod_dav
        run: cargo test -p pnxr-webdav --test real_server
      - name: S3 with network faults (toxiproxy)
        run: cargo test -p pnxr-s3 --test faults
      - if: failure()
        run: |
          docker compose -f scripts/heavy/compose.yml logs --tail 200
          tail -n 100 /tmp/tmp.*.log || true

  webdav-nextcloud:
    name: WebDAV (Nextcloud)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      PNXR_REQUIRE_SERVERS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: heavy
      # Nextcloud takes one to two minutes to install itself.
      - name: Start Nextcloud
        run: ONLY_DAV=1 NEXTCLOUD=1 scripts/heavy/up.sh >> "$GITHUB_ENV"
      - name: WebDAV against Nextcloud
        run: |
          PNXR_TEST_DAV_ORIGIN=$PNXR_TEST_NEXTCLOUD_ORIGIN \
          PNXR_TEST_DAV_BASE=$PNXR_TEST_NEXTCLOUD_BASE \
          PNXR_TEST_DAV_USER=$PNXR_TEST_NEXTCLOUD_USER \
          PNXR_TEST_DAV_PASSWORD=$PNXR_TEST_NEXTCLOUD_PASSWORD \
          cargo test -p pnxr-webdav --test real_server
      - if: failure()
        run: docker compose -f scripts/heavy/compose.yml --profile nextcloud logs --tail 200

  smb:
    name: SMB (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: SMB 2.1, min: SMB2_10, signing: auto }
          - { name: SMB 3, min: SMB3, signing: auto }
          - { name: SMB 3 with signing required, min: SMB3, signing: mandatory }
    env:
      PNXR_REQUIRE_SERVERS: "smb"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: heavy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends samba
      - run: sudo SMB_MIN_PROTOCOL=${{ matrix.min }} SMB_SIGNING=${{ matrix.signing }} scripts/smb-test-server.sh /var/tmp/pnxr-smb >> "$GITHUB_ENV"
      - run: cargo test -p pnxr-smb

  ssh:
    name: SSH (${{ matrix.variant }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [passphrase, changed-hostkey]
    env:
      PNXR_REQUIRE_SERVERS: "ssh"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: heavy
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - run: SSH_VARIANT=${{ matrix.variant }} scripts/ssh-test-server.sh /var/tmp/pnxr-ssh >> "$GITHUB_ENV"
      - name: Key with a passphrase from an agent
        if: matrix.variant == 'passphrase'
        run: cargo test -p pnxr-cli --test install install_serve
      - name: A changed host key is refused
        if: matrix.variant == 'changed-hostkey'
        run: cargo test -p pnxr-cli --test install a_changed_host_key

  # A failed nightly must be seen: it opens (or comments on) one issue.
  nightly-alert:
    name: Alert on a failed nightly
    needs: [lint, test, gui, gui-other, installers, s3-webdav-faults, webdav-nextcloud, smb, ssh]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly CI failed"
          body="The nightly full CI failed: $RUN"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
