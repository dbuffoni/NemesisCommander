# Windows (an installer and a portable zip) and macOS (dmg), built and smoke
# tested: install into a temporary folder, run `--version`, remove again.
#
# Called by the release workflow (which publishes them on a `v*` tag) and by
# the full CI tier (nightly). Without signing secrets the files are named
# `-unsigned`: Windows needs WINDOWS_CERT_PFX (base64 .pfx) and
# WINDOWS_CERT_PASSWORD, macOS MACOS_SIGN_IDENTITY plus the certificate in
# MACOS_CERT_P12 (base64) and MACOS_CERT_PASSWORD, and for notarization
# APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD.
name: Installers

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: installer
      # rust-cache can restore v8's build output without the prebuilt
      # library its build script downloaded; make the script run again.
      - name: Let v8 fetch its library
        shell: bash
        run: rm -rf target/*/build/v8-* target/*/.fingerprint/v8-* target/*/deps/libv8-* target/*/deps/v8-*
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          cache: true
      # Qt's qyieldcpu.h calls the ARM intrinsic __yield without including
      # its header, which the current Xcode's clang rejects.
      - if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-include arm_acle.h" >> "$GITHUB_ENV"
      - name: The version in the file names
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}" >> "$GITHUB_ENV"
      # Two builds: built together, Cargo would unify features and give
      # pnxr-gui pnxr's script engine (V8) as well.
      - name: Build pnxr and pnxr-gui
        shell: bash
        run: |
          cargo build --release --locked -p pnxr-cli --features rar
          cargo build --release --locked -p pnxr-gui --features rar

      # ---- Windows ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/build-zip.ps1 target/release $env:VERSION
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup did not install" }
          $zip = Get-ChildItem Pairnox-*-windows-*-portable*.zip | Select-Object -First 1
          packaging/windows/build-setup.ps1 $zip.FullName $env:VERSION
      - name: Smoke test of the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install for the current user into a temporary folder, run the
          # programs, remove again (the uninstaller runs from the folder).
          $setup = Get-ChildItem Pairnox-*-windows-*-setup*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "pnxr-setup-test"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir" -Wait
          & (Join-Path $dir "pnxr.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "installed pnxr.exe --version failed" }
          if (-not (Test-Path (Join-Path $dir "pnxr-gui.exe"))) { throw "no pnxr-gui.exe after install" }
          $uninstall = Get-ChildItem (Join-Path $dir "unins*.exe") | Select-Object -First 1
          Start-Process $uninstall.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir "pnxr.exe")) { throw "the uninstaller left pnxr.exe" }
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem Pairnox-*-windows-*-portable*.zip | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "pnxr-install"
          Expand-Archive $zip.FullName $dir
          $app = Join-Path $dir "Pairnox"
          & (Join-Path $app "pnxr.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "pnxr.exe --version failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & (Join-Path $app "pnxr-gui.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "pnxr-gui.exe --version failed" }
          if (-not (Test-Path (Join-Path $app "THIRD-PARTY-NOTICES.md"))) { throw "no notices" }
          # The window carries the Pairnox icon as an icon resource (RT_GROUP_ICON).
          python -m pip install --quiet pefile
          python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); ids=[e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries]; sys.exit(0 if 14 in ids else 'pnxr-gui.exe has no icon resource')" (Join-Path $app "pnxr-gui.exe")
          if ($LASTEXITCODE -ne 0) { throw "pnxr-gui.exe has no icon" }
          Remove-Item -Recurse -Force $dir
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            Pairnox-*-windows-*-portable*.zip
            Pairnox-*-windows-*-setup*.exe
          if-no-files-found: error

      # ---- macOS ----
      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/build-dmg.sh target/release "$VERSION"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls Pairnox-*-macos-*.dmg | head -1)
          mount="$RUNNER_TEMP/pnxr-mount"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          app="$mount/Pairnox.app/Contents"
          test -f "$app/Resources/THIRD-PARTY-NOTICES.md"
          # The bundle's icon, named in Info.plist.
          test -f "$app/Resources/Pairnox.icns"
          plutil -extract CFBundleIconFile raw "$app/Info.plist" | grep -qx Pairnox
          # A copy of the app, as a user installs it.
          cp -R "$mount/Pairnox.app" "$RUNNER_TEMP/"
          hdiutil detach "$mount"
          app="$RUNNER_TEMP/Pairnox.app/Contents"
          # The window needs a platform without a screen, which the bundle
          # does not carry; it is borrowed for the test. A build signed with
          # an identity refuses plugins signed by others, so it only starts.
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            cp "$QT_ROOT_DIR/plugins/platforms/libqoffscreen.dylib" "$app/PlugIns/platforms/"
          fi
          # Qt is hidden: what the bundle lacks must not be found on this
          # machine, as it would not be on a user's.
          mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.hidden"
          trap 'mv "$QT_ROOT_DIR.hidden" "$QT_ROOT_DIR"' EXIT
          "$app/MacOS/pnxr" --version
          "$app/MacOS/pnxr-gui" --version
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            QT_QPA_PLATFORM=offscreen "$app/MacOS/pnxr-gui" --self-test --keys=F1 | grep -q '"help"'
          fi
      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: Pairnox-*-macos-*.dmg
          if-no-files-found: error
