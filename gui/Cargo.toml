[package]
name = "pnxr-gui"
description = "Pairnox's desktop interface (Qt 6 / QML): two panels, menus and hotkeys, F1 for the main shortcuts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

# Needs Qt 6 (qmake6 on the PATH, or QMAKE pointing at it) to build, which
# is why the workspace builds it only when asked: `cargo build -p pnxr-gui`.

[[bin]]
name = "pnxr-gui"
path = "src/main.rs"

[dependencies]
pnxr-frontend = { workspace = true, features = ["scripting"] }
pnxr-app = { workspace = true, features = ["desktop", "remote"] }
pnxr-config.workspace = true
pnxr-vfs.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
cxx = "1"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }

[features]
# Read RAR archives with the bundled libarchive (ADR 0050).
rar = ["pnxr-app/rar"]

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

# Puts assets/branding/pairnox.ico into pnxr-gui.exe (file icon, taskbar,
# Alt+Tab, shortcuts) when the window is built on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
pnxr-preview.workspace = true

[lints]
workspace = true
