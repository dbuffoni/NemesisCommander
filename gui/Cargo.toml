[package]
name = "sc-gui"
description = "SuperCommander's desktop interface (Qt 6 / QML): two panels, menus and hotkeys, F1 for the main shortcuts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Needs Qt 6 (qmake6 on the PATH, or QMAKE pointing at it) to build, which
# is why the workspace builds it only when asked: `cargo build -p sc-gui`.

[[bin]]
name = "sc-gui"
path = "src/main.rs"

[dependencies]
sc-frontend.workspace = true
sc-app = { workspace = true, features = ["desktop"] }
sc-config.workspace = true
sc-vfs.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
cxx = "1"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
